<!doctype html>
<html lang="en" dark>
  <head>
    <meta charset="utf-8" />
    <title>Viewly</title>
    <link rel="stylesheet" href="showcase.css" />
  </head>
  <body>
    <ytd-app>
      <ytd-masthead>
        <div id="background"></div>
        <div class="mh">
          <span class="burger"><i></i></span>
          <span class="logo">
            <span id="logo-icon">
              <svg viewBox="0 0 30 22" aria-hidden="true">
                <path fill="#FF0033" d="M11 0h8a11 11 0 0 1 0 22h-8a11 11 0 0 1 0-22Z" />
                <path fill="white" d="M12 6.5v9l7.5-4.5Z" />
              </svg>
            </span>
            Viewly
          </span>
          <span class="search">
            <span class="ytSearchboxComponentInputBox" id="search-text">Search</span>
            <span class="ytSearchboxComponentSearchButton">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-4-4" />
              </svg>
            </span>
          </span>
          <span class="mh-actions"><span class="icon-dot"></span><span class="avatar"></span></span>
        </div>
      </ytd-masthead>
      <main id="view"></main>
    </ytd-app>
    <script src="showcase.js"></script>
  </body>
</html>
